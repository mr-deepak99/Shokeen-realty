<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101820" />
  <title>Shokeen Realty | Coming Soon</title>
  <style>
    :root {
      --gold: #c9a45c;
      --gold-light: #edcf91;
      --ink: #101820;
      --cream: #f7f3ea;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--cream);
      background:
        radial-gradient(circle at 75% 20%, rgba(201, 164, 92, 0.16), transparent 24rem),
        linear-gradient(135deg, #0d1318 0%, #172229 58%, #101820 100%);
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
    }

    .orb {
      position: fixed;
      width: 28rem;
      height: 28rem;
      right: -10rem;
      bottom: -14rem;
      border: 1px solid rgba(201, 164, 92, 0.28);
      border-radius: 50%;
      box-shadow:
        0 0 0 4rem rgba(201, 164, 92, 0.025),
        0 0 0 8rem rgba(201, 164, 92, 0.018);
      animation: breathe 6s ease-in-out infinite;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .card {
      width: min(760px, 92vw);
      text-align: center;
      padding: clamp(2rem, 7vw, 5.5rem) clamp(1.25rem, 5vw, 4rem);
      border: 1px solid rgba(237, 207, 145, 0.26);
      background: rgba(16, 24, 32, 0.38);
      backdrop-filter: blur(10px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.24);
      opacity: 0;
      transform: translateY(24px);
      animation: reveal 1.2s cubic-bezier(.2,.8,.2,1) 0.2s forwards;
    }

    .brand {
      width: fit-content;
      margin: 0 auto 1.5rem;
      color: var(--gold-light);
      font-size: clamp(0.78rem, 2vw, 0.95rem);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      letter-spacing: 0.38em;
      text-indent: 0.38em;
      text-transform: uppercase;
    }

    .brand-logo {
      width: clamp(118px, 24vw, 168px);
      height: clamp(118px, 24vw, 168px);
      margin: 0 auto 1.15rem;
      display: grid;
      place-items: center;
      position: relative;
      border: 1px solid rgba(201, 164, 92, 0.32);
      border-radius: 50%;
      background: rgba(16, 24, 32, 0.24);
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.18);
      animation: calm-breathe 5s ease-in-out infinite;
      isolation: isolate;
    }

    .brand-logo::before,
    .brand-logo::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border: 1px solid rgba(201, 164, 92, 0.24);
      border-radius: 50%;
      pointer-events: none;
      animation: ripple 5s ease-out infinite;
    }

    .brand-logo::after {
      animation-delay: 2.5s;
    }

    .brand-logo img {
      width: 78%;
      height: 78%;
      display: block;
      object-fit: contain;
      
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.24));
    }

    h1 {
      max-width: 680px;
      margin: 0 auto;
      font-size: clamp(2.2rem, 7vw, 5.2rem);
      line-height: 1.02;
      font-weight: 400;
      letter-spacing: -0.04em;
    }

    h1 span {
      color: var(--gold-light);
      display: inline-block;
    }

    .line {
      width: 70px;
      height: 1px;
      margin: 2rem auto;
      background: var(--gold);
      transform-origin: center;
      animation: stretch 1.8s cubic-bezier(.2,.8,.2,1) 1s both;
    }

    p {
      max-width: 560px;
      margin: 0 auto;
      color: rgba(247, 243, 234, 0.78);
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      line-height: 1.75;
      font-family: Arial, Helvetica, sans-serif;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      margin-top: 2rem;
      color: var(--gold-light);
      font-size: 1rem;
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .status i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gold-light);
      box-shadow: 0 0 12px var(--gold-light);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes calm-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes stretch {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.48; }
      70%, 100% { transform: scale(1.42); opacity: 0; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @media (max-width: 600px) {
      .card { min-height: 520px; display: flex; flex-direction: column; justify-content: center; }
      .orb { width: 19rem; height: 19rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="orb"></div>

  <main>
    <section class="card" aria-label="Shokeen Realty under construction">
      <p class="brand">Shokeen Realty</p>
      <div class="brand-logo" aria-label="Shokeen Realty logo">
        <img src="shokeen-logo-red.png" alt="Shokeen Realty" />
      </div>
      <h1>Welcome to <span>Shokeen Realty</span></h1>
      <div class="line"></div>
      <p>The website is currently under construction.<br />We’re preparing something exceptional. Thank you for your patience.</p>
      <div class="status"><i></i> Coming Soon</div>
    </section>
  </main>
</body>
</html>
